# Render Blueprint: single Web Service (API + React app)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: church-management-system
    runtime: node
    region: oregon

    # Build: install deps, build frontend, init DB + migrations
    buildCommand: npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Optional: use a persistent disk for SQLite (attach in Render dashboard)
      # - key: DATABASE_PATH
      #   value: /opt/render/project/data/database.sqlite

    # Health check so Render knows the app is up
    healthCheckPath: /api/health
