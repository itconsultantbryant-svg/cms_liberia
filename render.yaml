# Render Blueprint: single Web Service (API + React app)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: church-management-system
    runtime: node
    region: oregon

    # Build: install deps, build frontend, init DB + migrations
    buildCommand: npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard to your https service URL:
      # - key: CORS_ORIGIN
      #   value: https://YOUR-SERVICE.onrender.com
      # - key: APP_URL
      #   value: https://YOUR-SERVICE.onrender.com
      # Attach a Persistent Disk, then set:
      # - key: DATABASE_PATH
      #   value: /opt/render/project/data/database.sqlite
      # - key: UPLOADS_PATH
      #   value: /opt/render/project/data/uploads
      # - key: BACKUP_PATH
      #   value: /opt/render/project/data/backups

    # Liveness probe
    healthCheckPath: /api/health
